  <style>
    .fall {
      animation: leaf-fall 14s linear infinite;
    }

    .fall-2 { animation-delay: -4s; animation-duration: 17s; }
    .fall-3 { animation-delay: -9s; animation-duration: 15s; }
    .fall-4 { animation-delay: -6s; animation-duration: 19s; }
    .fall-5 { animation-delay: -12s; animation-duration: 16s; }
    .fall-6 { animation-delay: -2s; animation-duration: 18s; }

    @keyframes leaf-fall {
      0% {
        transform: translate(0, -35px);
        opacity: 0;
      }
      8% { opacity: .9; }
      40% { transform: translate(28px, 115px); }
      70% { transform: translate(-14px, 220px); }
      92% { opacity: .8; }
      100% {
        transform: translate(18px, 335px);
        opacity: 0;
      }
    }

    .turn {
      transform-box: fill-box;
      transform-origin: center;
      animation: leaf-turn 5s ease-in-out infinite;
    }

    @keyframes leaf-turn {
      0%, 100% { transform: rotate(-30deg) scaleX(.75); }
      50% { transform: rotate(45deg) scaleX(1); }
    }

    .steam {
      fill: none;
      stroke: #a79f91;
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0;
      animation: steam-rise 5s ease-out infinite;
    }

    .steam-2 { animation-delay: -2.5s; }

    @keyframes steam-rise {
      0% { transform: translateY(8px); opacity: 0; }
      25% { opacity: .35; }
      100% { transform: translate(5px, -25px); opacity: 0; }
    }

    .sunlight {
      pointer-events: none;
      animation: light-breathe 12s ease-in-out infinite;
    }

    @keyframes light-breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    .dust {
      animation: dust-drift 10s ease-in-out infinite;
    }

    .dust-2 { animation-delay: -5s; }

    @keyframes dust-drift {
      0%, 100% { transform: translate(0, 0); opacity: .15; }
      50% { transform: translate(-12px, -18px); opacity: .65; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fall, .turn, .steam, .sunlight, .dust {
        animation: none;
      }

      .fall { opacity: .7; }
      .steam { opacity: .2; }
    }
  </style>

