        d="M0 2h8M2 0v8"
        fill="none"
        stroke="#927453"
        stroke-width=".6"
        opacity=".12"
      />
    </pattern>

    <clipPath id="window-clip">
      <rect x="247" y="112" width="622" height="304" rx="12"/>
    </clipPath>

    <clipPath id="room-clip">
      <path
        d="M115 108q0-31 31-31h908q31 0 31 31v432
