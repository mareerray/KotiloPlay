<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="820"
  viewBox="0 0 1200 820"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">KotiloPlay autumn living room</title>
  <desc id="desc">
    A cozy living room with a sage-green sofa, plants, books,
    and warm tea. Beyond a large window, autumn leaves drift
    past golden trees while soft sunlight enters the room.
  </desc>

  <defs>
    <linearGradient id="wall" x2="0%" y2="100%">
      <stop stop-color="#faf0df"/>
      <stop offset="1" stop-color="#eddec7"/>
    </linearGradient>

    <linearGradient id="sky" x2="0%" y2="100%">
      <stop stop-color="#e8e6db"/>
      <stop offset=".6" stop-color="#f8e5c5"/>
      <stop offset="1" stop-color="#efcf98"/>
    </linearGradient>

    <linearGradient id="floor" x2="0%" y2="100%">
      <stop stop-color="#dcc29c"/>
      <stop offset="1" stop-color="#efddbd"/>
    </linearGradient>

    <linearGradient id="sofa" x2="0%" y2="100%">
      <stop stop-color="#b4c1a2"/>
      <stop offset="1" stop-color="#92a37e"/>
    </linearGradient>

    <linearGradient id="sunbeam" x1="85%" y1="0%" x2="20%" y2="100%">
      <stop stop-color="#fff5cf" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff5cf" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sun-glow">
      <stop stop-color="#fff6d8" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#f9d68d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#f9d68d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="floor-light">
      <stop stop-color="#fff1bb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff1bb" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="rug-weave"
      width="8"
      height="8"
      patternUnits="userSpaceOnUse"
    >
